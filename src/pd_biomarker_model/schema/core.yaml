id: https://w3id.org/pd-biomarker-model/core
name: pd_biomarker_model_core
title: Clinical biomarker core model
description: >-
  Disease-agnostic core for clinical cohort data: participants, visits,
  diagnoses, phenotypes, clinical assessments, specimens and biomarker
  measurements with provenance. Disease modules import this schema and
  narrow its value sets and rules.
version: 0.1.0
license: MIT
see_also:
  - https://barbavegeta.github.io/pd-biomarker-model

prefixes:
  linkml: https://w3id.org/linkml/
  pdbm: https://w3id.org/pd-biomarker-model/
  schema: http://schema.org/
  dcterms: http://purl.org/dc/terms/
  prov: http://www.w3.org/ns/prov#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  BFO: http://purl.obolibrary.org/obo/BFO_
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  UBERON: http://purl.obolibrary.org/obo/UBERON_
  OBI: http://purl.obolibrary.org/obo/OBI_
  PATO: http://purl.obolibrary.org/obo/PATO_
  NCIT: http://purl.obolibrary.org/obo/NCIT_
  STATO: http://purl.obolibrary.org/obo/STATO_
  UO: http://purl.obolibrary.org/obo/UO_
  PRIDE: http://purl.obolibrary.org/obo/PRIDE_
  CHEBI: http://purl.obolibrary.org/obo/CHEBI_
  LOINC: https://loinc.org/
  UniProtKB: http://purl.uniprot.org/uniprot/
  HGNC: http://identifiers.org/hgnc/
  ORCID: https://orcid.org/

default_prefix: pdbm
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Classes
# ---------------------------------------------------------------------------
classes:

  NamedThing:
    abstract: true
    description: Any record with a globally unique identifier.
    class_uri: schema:Thing
    slots:
      - id

  StudyDataset:
    is_a: NamedThing
    description: >-
      A versioned collection of cohort records with dataset-level metadata.
      Records refer to each other by identifier.
    class_uri: schema:Dataset
    slots:
      - title
      - description
      - dataset_version
      - license
      - created_on
      - conforms_to
      - is_synthetic
      - participants
      - visits
      - diagnoses
      - phenotype_observations
      - clinical_assessments
      - specimens
      - analytes
      - assays
      - biomarker_measurements

  Participant:
    is_a: NamedThing
    description: A person enrolled in the study.
    class_uri: schema:Person
    slots:
      - cohort
      - sex
      - year_of_birth
      - enrolment_date

  Visit:
    is_a: NamedThing
    description: A scheduled study visit at which data and specimens are collected.
    slots:
      - participant
      - visit_code
      - visit_date

  Diagnosis:
    is_a: NamedThing
    description: A clinical diagnosis recorded for a participant.
    slots:
      - participant
      - condition
      - age_at_symptom_onset
      - age_at_diagnosis

  PhenotypeObservation:
    is_a: NamedThing
    description: >-
      A phenotypic feature assessed at a visit, recorded as present or
      explicitly excluded.
    slots:
      - visit
      - phenotype
      - excluded

  ClinicalAssessment:
    is_a: NamedThing
    abstract: true
    description: >-
      The total score of a clinical rating scale administered at a visit.
      Disease modules subclass this and bind the instrument to their own
      value set.
    slots:
      - visit
      - instrument
      - score

  Specimen:
    is_a: NamedThing
    description: A biological sample collected at a visit.
    slots:
      - visit
      - specimen_type
      - freeze_thaw_cycles

  Analyte:
    is_a: NamedThing
    description: >-
      The molecular entity a measurement quantifies, identified by its
      UniProtKB accession so that values from different platforms can be
      linked to the same protein.
    slot_usage:
      id:
        pattern: "^UniProtKB:([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$"
    slots:
      - label
      - gene_symbol
      - hgnc_id

  Assay:
    is_a: NamedThing
    description: A measurement procedure, defined by its technology and platform.
    slots:
      - label
      - technology
      - platform

  BiomarkerMeasurement:
    is_a: NamedThing
    mixins:
      - ProvenanceMixin
    description: >-
      One biomarker value for one analyte at one visit, from a specimen
      (fluid or tissue) or from imaging.
    slots:
      - visit
      - specimen
      - assay
      - analyte
      - platform_probe_id
      - loinc_code
      - modality
      - measurement_type
      - value
      - unit
      - categorical_result
      - below_lloq
      - brain_region
      - laterality
    rules:
      - description: A ratio is dimensionless, so its unit must be the UCUM unity "1".
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string: RATIO
        postconditions:
          slot_conditions:
            unit:
              equals_string: "1"
      - description: A concentration must use a mass-concentration unit.
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string: CONCENTRATION
        postconditions:
          slot_conditions:
            unit:
              equals_string_in:
                - pg/mL
                - ng/mL
      - description: >-
          A relative abundance must use a platform-relative unit (SomaScan RFU
          or Olink NPX), never a mass concentration.
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string: RELATIVE_ABUNDANCE
        postconditions:
          slot_conditions:
            unit:
              equals_string_in:
                - "{RFU}"
                - "{NPX}"
      - description: A quantitative measurement needs a numeric value and a unit.
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string_in:
                - CONCENTRATION
                - RELATIVE_ABUNDANCE
                - RATIO
        postconditions:
          slot_conditions:
            value:
              required: true
            unit:
              required: true
      # Each absent slot gets its own rule: gen-json-schema combines several
      # ABSENT slots into one "not all present" check, which is too weak.
      - description: >-
          A categorical measurement needs a categorical result and must not
          carry a numeric value.
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string: CATEGORICAL
        postconditions:
          slot_conditions:
            categorical_result:
              required: true
            value:
              value_presence: ABSENT
      - description: A categorical measurement must not carry a unit.
        preconditions:
          slot_conditions:
            measurement_type:
              equals_string: CATEGORICAL
        postconditions:
          slot_conditions:
            unit:
              value_presence: ABSENT
      - description: >-
          An imaging measurement needs a brain region and laterality and has
          no specimen.
        preconditions:
          slot_conditions:
            modality:
              equals_string: IMAGING
        postconditions:
          slot_conditions:
            brain_region:
              required: true
            laterality:
              required: true
            specimen:
              value_presence: ABSENT
      - description: A specimen-based measurement needs a specimen and has no brain region.
        preconditions:
          slot_conditions:
            modality:
              equals_string: SPECIMEN
        postconditions:
          slot_conditions:
            specimen:
              required: true
            brain_region:
              value_presence: ABSENT
      - description: A human curator is identified by an ORCID.
        preconditions:
          slot_conditions:
            curator_type:
              equals_string: PERSON
        postconditions:
          slot_conditions:
            curator:
              pattern: "^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"

  ProvenanceMixin:
    mixin: true
    description: >-
      Who curated a record, when, from which source, and whether the curator
      was a person or an AI agent.
    slots:
      - source
      - curation_date
      - curator
      - curator_type

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------
slots:

  # --- identity and dataset metadata ---
  id:
    identifier: true
    range: uriorcurie
    required: true
    description: Globally unique identifier of the record, written as a CURIE.
    slot_uri: schema:identifier
    pattern: "^[A-Za-z][A-Za-z0-9_.-]*:[A-Za-z0-9_./-]+$"
  title:
    description: Human-readable title of the dataset.
    slot_uri: dcterms:title
    required: true
  description:
    description: Free-text description of the dataset.
    slot_uri: dcterms:description
  label:
    description: Human-readable name of the record.
    slot_uri: rdfs:label
    required: true
  dataset_version:
    description: Version of the dataset, in semantic versioning form.
    slot_uri: schema:version
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  license:
    description: Licence under which the dataset is released, as a URI.
    slot_uri: dcterms:license
    range: uri
    required: true
  created_on:
    description: Date the dataset was created.
    slot_uri: dcterms:created
    range: date
    required: true
  conforms_to:
    description: Identifier of the schema version the dataset conforms to.
    slot_uri: dcterms:conformsTo
    range: uri
    required: true
  is_synthetic:
    description: True when every record in the dataset is synthetic.
    range: boolean
    required: true

  # --- dataset collections ---
  participants:
    description: Participants in the dataset.
    range: Participant
    multivalued: true
    inlined_as_list: true
  visits:
    description: Visits in the dataset.
    range: Visit
    multivalued: true
    inlined_as_list: true
  diagnoses:
    description: Diagnoses in the dataset.
    range: Diagnosis
    multivalued: true
    inlined_as_list: true
  phenotype_observations:
    description: Phenotype observations in the dataset.
    range: PhenotypeObservation
    multivalued: true
    inlined_as_list: true
  clinical_assessments:
    description: Clinical assessments in the dataset.
    range: ClinicalAssessment
    multivalued: true
    inlined_as_list: true
  specimens:
    description: Specimens in the dataset.
    range: Specimen
    multivalued: true
    inlined_as_list: true
  analytes:
    description: Analytes measured in the dataset.
    range: Analyte
    multivalued: true
    inlined_as_list: true
  assays:
    description: Assays used in the dataset.
    range: Assay
    multivalued: true
    inlined_as_list: true
  biomarker_measurements:
    description: Biomarker measurements in the dataset.
    range: BiomarkerMeasurement
    multivalued: true
    inlined_as_list: true

  # --- participant and visit ---
  cohort:
    description: Study arm the participant was enrolled in.
    range: CohortEnum
    required: true
  sex:
    description: Biological sex of the participant.
    range: SexEnum
  year_of_birth:
    description: Year of birth (full dates of birth are not recorded).
    range: integer
    minimum_value: 1900
    maximum_value: 2026
  enrolment_date:
    description: Date the participant was enrolled.
    range: date
    required: true
  participant:
    description: The participant this record belongs to.
    range: Participant
    required: true
  visit:
    description: The visit at which this record was collected.
    range: Visit
    required: true
  visit_code:
    description: >-
      Protocol visit code as months from baseline, e.g. M00 for baseline and
      M12 for month 12.
    required: true
    pattern: "^M[0-9]{2,3}$"
  visit_date:
    description: Date the visit took place.
    range: date
    required: true

  # --- diagnosis and phenotype ---
  condition:
    description: Diagnosed condition, as a MONDO term.
    range: DiseaseEnum
    required: true
  age_at_symptom_onset:
    description: Age in years at onset of the first symptom attributed to the condition.
    range: float
    minimum_value: 0
    maximum_value: 120
    unit:
      ucum_code: a
  age_at_diagnosis:
    description: Age in years when the condition was diagnosed.
    range: float
    minimum_value: 0
    maximum_value: 120
    unit:
      ucum_code: a
  phenotype:
    description: Phenotypic feature, as an HPO term.
    range: PhenotypeEnum
    required: true
  excluded:
    description: True when the feature was looked for and found absent.
    range: boolean
    ifabsent: "false"

  # --- clinical assessment ---
  instrument:
    description: >-
      The rating scale and score that was recorded. Disease modules bind this
      to their own value set.
    required: true
  score:
    description: Total score on the instrument.
    range: float
    required: true

  # --- specimen ---
  specimen_type:
    description: Anatomical material of the specimen, as an UBERON term.
    range: SpecimenTypeEnum
    required: true
  freeze_thaw_cycles:
    description: Number of freeze-thaw cycles before analysis.
    range: integer
    minimum_value: 0
    maximum_value: 20

  # --- analyte and assay ---
  gene_symbol:
    description: HGNC-approved symbol of the gene encoding the analyte.
    pattern: "^[A-Z][A-Z0-9-]*$"
  hgnc_id:
    description: HGNC identifier of the gene encoding the analyte.
    range: uriorcurie
    pattern: "^HGNC:[0-9]+$"
  technology:
    description: Assay technology, as an OBI or NCIT term.
    range: AssayTechnologyEnum
    required: true
  platform:
    description: Commercial platform and panel version, where one applies.
    range: PlatformEnum

  # --- measurement ---
  specimen:
    description: The specimen that was assayed. Absent for imaging measurements.
    range: Specimen
  assay:
    description: The assay that produced the value.
    range: Assay
    required: true
  analyte:
    description: The analyte that was measured.
    range: Analyte
    required: true
  platform_probe_id:
    description: >-
      Platform-specific reagent identifier: a SomaScan SeqId (e.g.
      seq.12345.6) or an Olink assay ID (e.g. OID12345).
    pattern: "^(seq\\.[0-9]{4,5}\\.[0-9]{1,3}|OID[0-9]{5})$"
  loinc_code:
    description: LOINC code of the laboratory test, where one exists.
    range: uriorcurie
    pattern: "^LOINC:[0-9]{1,7}-[0-9]$"
  modality:
    description: Whether the value comes from a specimen or from imaging.
    range: ModalityEnum
    required: true
  measurement_type:
    description: Kind of quantity the value represents.
    range: MeasurementTypeEnum
    required: true
  value:
    description: Numeric value of a quantitative measurement.
    range: float
  unit:
    description: Unit of the value, as a UCUM code.
    range: UnitEnum
  categorical_result:
    description: Result of a qualitative assay.
    range: CategoricalResultEnum
  below_lloq:
    description: True when the value is below the assay's lower limit of quantification.
    range: boolean
  brain_region:
    description: Brain region of an imaging measurement, as an UBERON term.
    range: BrainRegionEnum
  laterality:
    description: Side of the body the imaging value refers to.
    range: LateralityEnum

  # --- provenance ---
  source:
    description: Identifier or name of the source dataset, file or system the record was taken from.
    slot_uri: prov:hadPrimarySource
    required: true
  curation_date:
    description: Date the record was curated.
    slot_uri: prov:generatedAtTime
    range: date
    required: true
  curator:
    description: >-
      Who curated the record: an ORCID for a person, or a versioned agent
      identifier for an AI agent.
    slot_uri: prov:wasAttributedTo
    range: uriorcurie
    required: true
  curator_type:
    description: Whether the curator was a person or an AI agent.
    range: CuratorTypeEnum
    required: true

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------
enums:

  CohortEnum:
    description: Study arm a participant was enrolled in.
    permissible_values:
      CASE:
        description: Enrolled because they have the condition under study.
        title: "Participant Case"
        meaning: NCIT:C216103
      HEALTHY_CONTROL:
        description: Enrolled as a healthy comparison participant.
        title: "Healthy Control"
        meaning: NCIT:C94342
      PRODROMAL:
        description: Enrolled with prodromal features but no diagnosis.
        title: "Prodromal Phase of Disease"
        meaning: NCIT:C209884

  SexEnum:
    description: Biological sex.
    permissible_values:
      FEMALE:
        description: Female.
        title: "female"
        meaning: PATO:0000383
      MALE:
        description: Male.
        title: "male"
        meaning: PATO:0000384

  DiseaseEnum:
    description: Any disease in MONDO.
    reachable_from:
      source_ontology: obo:mondo
      source_nodes:
        - MONDO:0000001
      relationship_types:
        - rdfs:subClassOf
      include_self: false

  PhenotypeEnum:
    description: Any phenotypic abnormality in HPO.
    reachable_from:
      source_ontology: obo:hp
      source_nodes:
        - HP:0000118
      relationship_types:
        - rdfs:subClassOf
      include_self: false

  SpecimenTypeEnum:
    description: Anatomical material a specimen consists of.
    permissible_values:
      CSF:
        description: Cerebrospinal fluid.
        title: "cerebrospinal fluid"
        meaning: UBERON:0001359
      PLASMA:
        description: Blood plasma.
        title: "blood plasma"
        meaning: UBERON:0001969
      SERUM:
        description: Blood serum.
        title: "blood serum"
        meaning: UBERON:0001977
      WHOLE_BLOOD:
        description: Whole blood.
        title: "blood"
        meaning: UBERON:0000178
      SKIN:
        description: Skin biopsy.
        title: "skin of body"
        meaning: UBERON:0002097

  BrainRegionEnum:
    description: Any part of the brain in UBERON.
    reachable_from:
      source_ontology: obo:uberon
      source_nodes:
        - UBERON:0000955
      relationship_types:
        - rdfs:subClassOf
        - BFO:0000050
      include_self: true

  LateralityEnum:
    description: Side of the body.
    permissible_values:
      LEFT:
        description: Left side.
        title: "left"
        meaning: PATO:0000366
      RIGHT:
        description: Right side.
        title: "right"
        meaning: PATO:0000367
      BILATERAL:
        description: Both sides, reported as the mean of left and right.
        title: "bilateral"
        meaning: PATO:0000618

  ModalityEnum:
    description: Source of a biomarker value.
    permissible_values:
      SPECIMEN:
        description: Measured in a fluid or tissue specimen.
      IMAGING:
        description: Measured from an imaging scan.
        title: "imaging assay"
        meaning: OBI:0000185

  MeasurementTypeEnum:
    description: Kind of quantity a biomarker value represents.
    permissible_values:
      CONCENTRATION:
        description: Absolute amount per volume, e.g. pg/mL.
        title: "concentration of"
        meaning: PATO:0000033
      RELATIVE_ABUNDANCE:
        description: >-
          Platform-relative signal that is not an absolute concentration,
          e.g. SomaScan RFU or Olink NPX.
      RATIO:
        description: Dimensionless ratio, e.g. a DaT-SPECT specific binding ratio.
        title: "ratio"
        meaning: STATO:0000184
      CATEGORICAL:
        description: Qualitative result, e.g. a seed amplification assay call.

  UnitEnum:
    description: >-
      Units as case-sensitive UCUM codes. Curly-brace codes are UCUM
      annotations for arbitrary, platform-specific units.
    permissible_values:
      pg/mL:
        description: Picograms per millilitre.
        title: "picogram per milliliter"
        meaning: UO:0010070
      ng/mL:
        description: Nanograms per millilitre.
        title: "nanogram per milliliter"
        meaning: UO:0000275
      "1":
        description: Dimensionless (UCUM unity), used for ratios.
        title: "dimensionless unit"
        meaning: UO:0000186
      "{RFU}":
        description: SomaScan relative fluorescence units.
        title: "Relative Fluorescence Intensity Unit"
        meaning: NCIT:C77535
      "{NPX}":
        description: Olink normalised protein expression, an arbitrary log2 unit.

  CategoricalResultEnum:
    description: Result of a qualitative assay.
    permissible_values:
      POSITIVE:
        description: The target was detected.
        title: "Positive Finding"
        meaning: NCIT:C38758
      NEGATIVE:
        description: The target was not detected.
        title: "Negative Finding"
        meaning: NCIT:C38757
      INDETERMINATE:
        description: The result could not be called positive or negative.
        title: "Indeterminate"
        meaning: NCIT:C48658

  AssayTechnologyEnum:
    description: Assay technology.
    permissible_values:
      ELISA:
        description: Enzyme-linked immunosorbent assay.
        title: "enzyme-linked immunosorbent assay"
        meaning: OBI:0000661
      SIMOA:
        description: Single-molecule array digital immunoassay.
        title: "Single-Molecule Array"
        meaning: NCIT:C161406
      SOMASCAN:
        description: SomaScan aptamer-based proteomic assay.
        title: "SOMAscan assay"
        meaning: OBI:0003111
      OLINK:
        description: Olink proximity extension assay.
        title: "Olink assay"
        meaning: OBI:0003112
        broad_mappings:
          - OBI:0003113
      SEED_AMPLIFICATION_ASSAY:
        description: >-
          Alpha-synuclein seed amplification assay (e.g. RT-QuIC). No
          ontology has a specific term, so only a broad mapping is given.
        broad_mappings:
          - OBI:0000070
      SPECT:
        description: Single-photon emission computed tomography.
        title: "Single Photon Emission Computed Tomography"
        meaning: NCIT:C17203
        broad_mappings:
          - OBI:0000185

  PlatformEnum:
    description: Commercial platform and panel version.
    permissible_values:
      SOMASCAN_5K:
        description: SomaScan 5K panel (assay v4.0).
        title: "SomaScan 5K"
        meaning: PRIDE:0000933
      SOMASCAN_7K:
        description: SomaScan 7K panel (assay v4.1).
        title: "SomaScan 7K"
        meaning: PRIDE:0000934
      OLINK_EXPLORE_3072:
        description: Olink Explore 3072 panel.
        title: "Olink Explore 3072/384"
        meaning: PRIDE:0000657
      OLINK_EXPLORE_HT:
        description: Olink Explore HT panel.
        title: "Olink Explore HT"
        meaning: PRIDE:0000673
      SIMOA_HD_X:
        description: Quanterix Simoa HD-X analyser. No ontology term exists.
      DAT_SPECT_IOFLUPANE:
        description: Dopamine transporter SPECT with the tracer ioflupane (123I).
        related_mappings:
          - CHEBI:68855

  CuratorTypeEnum:
    description: Kind of agent that curated a record.
    permissible_values:
      PERSON:
        description: A human curator.
        title: "Person"
        meaning: prov:Person
      AI_AGENT:
        description: An AI agent, such as an LLM-based curation tool.
        title: "SoftwareAgent"
        meaning: prov:SoftwareAgent
