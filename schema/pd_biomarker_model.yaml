    description: True when the value is below the assay's lower limit of quantification.
    from_schema: https://w3id.org/pd-biomarker-model/core
    slot_uri: pdbm:below_lloq
    owner: BiomarkerMeasurement
    domain_of:
    - BiomarkerMeasurement
    range: boolean
  brain_region:
    name: brain_region
    definition_uri: https://w3id.org/pd-biomarker-model/brain_region
    description: Brain region of an imaging measurement, as an UBERON term.
    from_schema: https://w3id.org/pd-biomarker-model/core
    slot_uri: pdbm:brain_region
    owner: BiomarkerMeasurement
    domain_of:
    - BiomarkerMeasurement
    range: BrainRegionEnum
  laterality:
    name: laterality
    definition_uri: https://w3id.org/pd-biomarker-model/laterality
    description: Side of the body the imaging value refers to.
    from_schema: https://w3id.org/pd-biomarker-model/core
    slot_uri: pdbm:laterality
    owner: BiomarkerMeasurement
    domain_of:
    - BiomarkerMeasurement
    range: LateralityEnum
  source:
    name: source
    definition_uri: https://w3id.org/pd-biomarker-model/source
    description: Identifier or name of the source dataset, file or system the record
      was taken from.
    from_schema: https://w3id.org/pd-biomarker-model/core
    mappings:
    - prov:hadPrimarySource
    slot_uri: prov:hadPrimarySource
    owner: ProvenanceMixin
    domain_of:
    - ProvenanceMixin
    range: string
    required: true
  curation_date:
    name: curation_date
    definition_uri: https://w3id.org/pd-biomarker-model/curation_date
    description: Date the record was curated.
    from_schema: https://w3id.org/pd-biomarker-model/core
    mappings:
    - prov:generatedAtTime
    slot_uri: prov:generatedAtTime
    owner: ProvenanceMixin
    domain_of:
    - ProvenanceMixin
    range: date
    required: true
  curator:
    name: curator
    definition_uri: https://w3id.org/pd-biomarker-model/curator
    description: 'Who curated the record: an ORCID for a person, or a versioned agent
      identifier for an AI agent.'
    from_schema: https://w3id.org/pd-biomarker-model/core
    mappings:
    - prov:wasAttributedTo
    slot_uri: prov:wasAttributedTo
    owner: ProvenanceMixin
    domain_of:
    - ProvenanceMixin
    range: uriorcurie
    required: true
  curator_type:
    name: curator_type
    definition_uri: https://w3id.org/pd-biomarker-model/curator_type
    description: Whether the curator was a person or an AI agent.
    from_schema: https://w3id.org/pd-biomarker-model/core
    slot_uri: pdbm:curator_type
    owner: ProvenanceMixin
    domain_of:
    - ProvenanceMixin
    range: CuratorTypeEnum
    required: true
  ParkinsonsStudyDataset_diagnoses:
    name: ParkinsonsStudyDataset_diagnoses
    definition_uri: https://w3id.org/pd-biomarker-model/diagnoses
    description: Diagnoses in the dataset.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: diagnoses
    domain: ParkinsonsStudyDataset
    slot_uri: pdbm:diagnoses
    alias: diagnoses
    owner: ParkinsonsStudyDataset
    domain_of:
    - ParkinsonsStudyDataset
    is_usage_slot: true
    usage_slot_name: diagnoses
    range: ParkinsonsDiagnosis
    multivalued: true
    inlined: true
    inlined_as_list: true
  ParkinsonsStudyDataset_clinical_assessments:
    name: ParkinsonsStudyDataset_clinical_assessments
    definition_uri: https://w3id.org/pd-biomarker-model/clinical_assessments
    description: Clinical assessments in the dataset.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: clinical_assessments
    domain: ParkinsonsStudyDataset
    slot_uri: pdbm:clinical_assessments
    alias: clinical_assessments
    owner: ParkinsonsStudyDataset
    domain_of:
    - ParkinsonsStudyDataset
    is_usage_slot: true
    usage_slot_name: clinical_assessments
    range: ParkinsonsClinicalAssessment
    multivalued: true
    inlined: true
    inlined_as_list: true
  ParkinsonsDiagnosis_condition:
    name: ParkinsonsDiagnosis_condition
    definition_uri: https://w3id.org/pd-biomarker-model/condition
    description: Diagnosed condition, as a MONDO term.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: condition
    domain: ParkinsonsDiagnosis
    slot_uri: pdbm:condition
    alias: condition
    owner: ParkinsonsDiagnosis
    domain_of:
    - ParkinsonsDiagnosis
    is_usage_slot: true
    usage_slot_name: condition
    range: ParkinsonianDisorderEnum
    required: true
  ParkinsonsClinicalAssessment_instrument:
    name: ParkinsonsClinicalAssessment_instrument
    definition_uri: https://w3id.org/pd-biomarker-model/instrument
    description: The rating scale and score that was recorded. Disease modules bind
      this to their own value set.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: instrument
    domain: ParkinsonsClinicalAssessment
    slot_uri: pdbm:instrument
    alias: instrument
    owner: ParkinsonsClinicalAssessment
    domain_of:
    - ParkinsonsClinicalAssessment
    is_usage_slot: true
    usage_slot_name: instrument
    range: ParkinsonsInstrumentEnum
    required: true
  Analyte_id:
    name: Analyte_id
    definition_uri: https://w3id.org/pd-biomarker-model/id
    description: Globally unique identifier of the record, written as a CURIE.
    from_schema: https://w3id.org/pd-biomarker-model/core
    mappings:
    - schema:identifier
    is_a: id
    domain: Analyte
    slot_uri: schema:identifier
    identifier: true
    alias: id
    owner: Analyte
    domain_of:
    - Analyte
    is_usage_slot: true
    usage_slot_name: id
    range: uriorcurie
    required: true
    pattern: ^UniProtKB:([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$
classes:
  ParkinsonsStudyDataset:
    name: ParkinsonsStudyDataset
    definition_uri: https://w3id.org/pd-biomarker-model/ParkinsonsStudyDataset
    description: A study dataset whose diagnoses and assessments follow the Parkinson's
      module.
    from_schema: https://w3id.org/pd-biomarker-model
    is_a: StudyDataset
    slots:
    - id
    - title
    - description
    - dataset_version
    - license
    - created_on
    - conforms_to
    - is_synthetic
    - participants
    - visits
    - phenotype_observations
    - specimens
    - analytes
    - assays
    - biomarker_measurements
    - ParkinsonsStudyDataset_diagnoses
    - ParkinsonsStudyDataset_clinical_assessments
    slot_usage:
      diagnoses:
        name: diagnoses
        range: ParkinsonsDiagnosis
      clinical_assessments:
        name: clinical_assessments
        range: ParkinsonsClinicalAssessment
    class_uri: pdbm:ParkinsonsStudyDataset
    tree_root: true
  ParkinsonsDiagnosis:
    name: ParkinsonsDiagnosis
    definition_uri: https://w3id.org/pd-biomarker-model/ParkinsonsDiagnosis
    description: Diagnosis of a parkinsonian disorder, with the clinical criteria
      used and their level of certainty.
    from_schema: https://w3id.org/pd-biomarker-model
    is_a: Diagnosis
    slots:
    - id
    - participant
    - age_at_symptom_onset
    - age_at_diagnosis
    - diagnostic_criteria
    - diagnostic_certainty
    - ParkinsonsDiagnosis_condition
    slot_usage:
      condition:
        name: condition
        range: ParkinsonianDisorderEnum
    class_uri: pdbm:ParkinsonsDiagnosis
  ParkinsonsClinicalAssessment:
    name: ParkinsonsClinicalAssessment
    definition_uri: https://w3id.org/pd-biomarker-model/ParkinsonsClinicalAssessment
    description: Total score on a Parkinson's rating scale, with the dopaminergic
      medication state at the time of a motor examination.
    from_schema: https://w3id.org/pd-biomarker-model
    is_a: ClinicalAssessment
    slots:
    - id
    - visit
    - score
    - medication_state
    - ParkinsonsClinicalAssessment_instrument
    slot_usage:
      instrument:
        name: instrument
        range: ParkinsonsInstrumentEnum
    class_uri: pdbm:ParkinsonsClinicalAssessment
    rules:
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: MDS_UPDRS_PART_I
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 52
      description: MDS-UPDRS Part I total ranges from 0 to 52.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: MDS_UPDRS_PART_II
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 52
      description: MDS-UPDRS Part II total ranges from 0 to 52.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: MDS_UPDRS_PART_III
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 132
      description: MDS-UPDRS Part III total ranges from 0 to 132.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: MDS_UPDRS_PART_IV
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 24
      description: MDS-UPDRS Part IV total ranges from 0 to 24.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: HOEHN_YAHR
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 5
      description: Hoehn and Yahr stage ranges from 0 to 5.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string: MOCA
      postconditions:
        slot_conditions:
          score:
            name: score
            minimum_value: 0
            maximum_value: 30
      description: MoCA total ranges from 0 to 30.
    - preconditions:
        slot_conditions:
          instrument:
            name: instrument
            equals_string_in:
            - MDS_UPDRS_PART_III
            - HOEHN_YAHR
      postconditions:
        slot_conditions:
          medication_state:
            name: medication_state
            required: true
      description: Motor examination scores depend on medication, so MDS-UPDRS Part
        III and Hoehn and Yahr need the medication state.
  NamedThing:
    name: NamedThing
    definition_uri: https://w3id.org/pd-biomarker-model/NamedThing
    description: Any record with a globally unique identifier.
    from_schema: https://w3id.org/pd-biomarker-model/core
    exact_mappings:
    - schema:Thing
    abstract: true
    slots:
    - id
    class_uri: schema:Thing
  StudyDataset:
    name: StudyDataset
    definition_uri: https://w3id.org/pd-biomarker-model/StudyDataset
    description: A versioned collection of cohort records with dataset-level metadata.
      Records refer to each other by identifier. Disease modules subclass this and
      narrow the ranges of its record lists.
    from_schema: https://w3id.org/pd-biomarker-model/core
    exact_mappings:
    - schema:Dataset
    is_a: NamedThing
    abstract: true
    slots:
    - id
    - title
    - description
    - dataset_version
    - license
    - created_on
    - conforms_to
    - is_synthetic
    - participants
    - visits
    - diagnoses
    - phenotype_observations
    - clinical_assessments
    - specimens
    - analytes
    - assays
    - biomarker_measurements
    class_uri: schema:Dataset
  Participant:
    name: Participant
    definition_uri: https://w3id.org/pd-biomarker-model/Participant
    description: A person enrolled in the study.
    from_schema: https://w3id.org/pd-biomarker-model/core
    exact_mappings:
    - schema:Person
    is_a: NamedThing
    slots:
    - id
    - cohort
    - sex
    - year_of_birth
    - enrolment_date
    class_uri: schema:Person
  Visit:
    name: Visit
    definition_uri: https://w3id.org/pd-biomarker-model/Visit
    description: A scheduled study visit at which data and specimens are collected.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    slots:
    - id
    - participant
    - visit_code
    - visit_date
    class_uri: pdbm:Visit
  Diagnosis:
    name: Diagnosis
    definition_uri: https://w3id.org/pd-biomarker-model/Diagnosis
    description: A clinical diagnosis recorded for a participant. Disease modules
      subclass this and bind the condition to their own value set.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    abstract: true
    slots:
    - id
    - participant
    - condition
    - age_at_symptom_onset
    - age_at_diagnosis
    class_uri: pdbm:Diagnosis
  PhenotypeObservation:
    name: PhenotypeObservation
    definition_uri: https://w3id.org/pd-biomarker-model/PhenotypeObservation
    description: A phenotypic feature assessed at a visit, recorded as present or
      explicitly excluded.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    slots:
    - id
    - visit
    - phenotype
    - excluded
    class_uri: pdbm:PhenotypeObservation
  ClinicalAssessment:
    name: ClinicalAssessment
    definition_uri: https://w3id.org/pd-biomarker-model/ClinicalAssessment
    description: The total score of a clinical rating scale administered at a visit.
      Disease modules subclass this and bind the instrument to their own value set.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    abstract: true
    slots:
    - id
    - visit
    - instrument
    - score
    class_uri: pdbm:ClinicalAssessment
  Specimen:
    name: Specimen
    definition_uri: https://w3id.org/pd-biomarker-model/Specimen
    description: A biological sample collected at a visit.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    slots:
    - id
    - visit
    - specimen_type
    - freeze_thaw_cycles
    class_uri: pdbm:Specimen
  Analyte:
    name: Analyte
    definition_uri: https://w3id.org/pd-biomarker-model/Analyte
    description: The molecular entity a measurement quantifies, identified by its
      UniProtKB accession so that values from different platforms can be linked to
      the same protein.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    slots:
    - label
    - gene_symbol
    - hgnc_id
    - Analyte_id
    slot_usage:
      id:
        name: id
        pattern: ^UniProtKB:([OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9]([A-Z][A-Z0-9]{2}[0-9]){1,2})$
    class_uri: pdbm:Analyte
  Assay:
    name: Assay
    definition_uri: https://w3id.org/pd-biomarker-model/Assay
    description: A measurement procedure, defined by its technology and platform.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    slots:
    - id
    - label
    - technology
    - platform
    class_uri: pdbm:Assay
  BiomarkerMeasurement:
    name: BiomarkerMeasurement
    definition_uri: https://w3id.org/pd-biomarker-model/BiomarkerMeasurement
    description: One biomarker value for one analyte at one visit, from a specimen
      (fluid or tissue) or from imaging.
    from_schema: https://w3id.org/pd-biomarker-model/core
    is_a: NamedThing
    mixins:
    - ProvenanceMixin
    slots:
    - id
    - visit
    - specimen
    - assay
    - analyte
    - platform_probe_id
    - loinc_code
    - modality
    - measurement_type
    - value
    - unit
    - categorical_result
    - below_lloq
    - brain_region
    - laterality
    - source
    - curation_date
    - curator
    - curator_type
    class_uri: pdbm:BiomarkerMeasurement
    rules:
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string: RATIO
      postconditions:
        slot_conditions:
          unit:
            name: unit
            equals_string: '1'
      description: A ratio is dimensionless, so its unit must be the UCUM unity "1".
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string: CONCENTRATION
      postconditions:
        slot_conditions:
          unit:
            name: unit
            equals_string_in:
            - pg/mL
            - ng/mL
      description: A concentration must use a mass-concentration unit.
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string: RELATIVE_ABUNDANCE
      postconditions:
        slot_conditions:
          unit:
            name: unit
            equals_string_in:
            - '{RFU}'
            - '{NPX}'
      description: A relative abundance must use a platform-relative unit (SomaScan
        RFU or Olink NPX), never a mass concentration.
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string_in:
            - CONCENTRATION
            - RELATIVE_ABUNDANCE
            - RATIO
      postconditions:
        slot_conditions:
          value:
            name: value
            required: true
          unit:
            name: unit
            required: true
      description: A quantitative measurement needs a numeric value and a unit.
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string: CATEGORICAL
      postconditions:
        slot_conditions:
          categorical_result:
            name: categorical_result
            required: true
          value:
            name: value
            value_presence: ABSENT
      description: A categorical measurement needs a categorical result and must not
        carry a numeric value.
    - preconditions:
        slot_conditions:
          measurement_type:
            name: measurement_type
            equals_string: CATEGORICAL
      postconditions:
        slot_conditions:
          unit:
            name: unit
            value_presence: ABSENT
      description: A categorical measurement must not carry a unit.
    - preconditions:
        slot_conditions:
          modality:
            name: modality
            equals_string: IMAGING
      postconditions:
        slot_conditions:
          brain_region:
            name: brain_region
            required: true
          laterality:
            name: laterality
            required: true
          specimen:
            name: specimen
            value_presence: ABSENT
      description: An imaging measurement needs a brain region and laterality and
        has no specimen.
    - preconditions:
        slot_conditions:
          modality:
            name: modality
            equals_string: SPECIMEN
      postconditions:
        slot_conditions:
          specimen:
            name: specimen
            required: true
          brain_region:
            name: brain_region
            value_presence: ABSENT
      description: A specimen-based measurement needs a specimen and has no brain
        region.
    - preconditions:
        slot_conditions:
          curator_type:
            name: curator_type
            equals_string: PERSON
      postconditions:
        slot_conditions:
          curator:
            name: curator
            pattern: ^ORCID:[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$
      description: A human curator is identified by an ORCID.
  ProvenanceMixin:
    name: ProvenanceMixin
    definition_uri: https://w3id.org/pd-biomarker-model/ProvenanceMixin
    description: Who curated a record, when, from which source, and whether the curator
      was a person or an AI agent.
    from_schema: https://w3id.org/pd-biomarker-model/core
    abstract: true
    mixin: true
    slots:
    - source
    - curation_date
    - curator
    - curator_type
    class_uri: pdbm:ProvenanceMixin
