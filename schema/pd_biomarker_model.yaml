name: pd_biomarker_model
description: Parkinson's disease module of the clinical biomarker core. It narrows
  diagnoses to parkinsonian disorders, binds clinical assessments to MDS-UPDRS, MoCA
  and Hoehn and Yahr, and adds instrument-specific validation rules.
title: Parkinson's disease biomarker model
see_also:
- https://barbavegeta.github.io/pd-biomarker-model
id: https://w3id.org/pd-biomarker-model
version: 0.2.0
imports:
- linkml:types
- core
license: MIT
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  pdbm:
    prefix_prefix: pdbm
    prefix_reference: https://w3id.org/pd-biomarker-model/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dcterms:
    prefix_prefix: dcterms
    prefix_reference: http://purl.org/dc/terms/
  prov:
    prefix_prefix: prov
    prefix_reference: http://www.w3.org/ns/prov#
  rdfs:
    prefix_prefix: rdfs
    prefix_reference: http://www.w3.org/2000/01/rdf-schema#
  BFO:
    prefix_prefix: BFO
    prefix_reference: http://purl.obolibrary.org/obo/BFO_
  MONDO:
    prefix_prefix: MONDO
    prefix_reference: http://purl.obolibrary.org/obo/MONDO_
  HP:
    prefix_prefix: HP
    prefix_reference: http://purl.obolibrary.org/obo/HP_
  UBERON:
    prefix_prefix: UBERON
    prefix_reference: http://purl.obolibrary.org/obo/UBERON_
  OBI:
    prefix_prefix: OBI
    prefix_reference: http://purl.obolibrary.org/obo/OBI_
  PATO:
    prefix_prefix: PATO
    prefix_reference: http://purl.obolibrary.org/obo/PATO_
  NCIT:
    prefix_prefix: NCIT
    prefix_reference: http://purl.obolibrary.org/obo/NCIT_
  STATO:
    prefix_prefix: STATO
    prefix_reference: http://purl.obolibrary.org/obo/STATO_
  UO:
    prefix_prefix: UO
    prefix_reference: http://purl.obolibrary.org/obo/UO_
  PRIDE:
    prefix_prefix: PRIDE
    prefix_reference: http://purl.obolibrary.org/obo/PRIDE_
  CHEBI:
    prefix_prefix: CHEBI
    prefix_reference: http://purl.obolibrary.org/obo/CHEBI_
  LOINC:
    prefix_prefix: LOINC
    prefix_reference: https://loinc.org/
  UniProtKB:
    prefix_prefix: UniProtKB
    prefix_reference: http://purl.uniprot.org/uniprot/
  HGNC:
    prefix_prefix: HGNC
    prefix_reference: http://identifiers.org/hgnc/
  ORCID:
    prefix_prefix: ORCID
    prefix_reference: https://orcid.org/
  doi:
    prefix_prefix: doi
    prefix_reference: https://doi.org/
default_prefix: pdbm
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ParkinsonianDisorderEnum:
    name: ParkinsonianDisorderEnum
    definition_uri: https://w3id.org/pd-biomarker-model/ParkinsonianDisorderEnum
    description: Parkinson disease and the atypical parkinsonian disorders it is most
      often distinguished from. MONDO files multiple system atrophy and Lewy body
      dementia under synucleinopathy, and progressive supranuclear palsy under movement
      disorder, rather than under parkinsonian disorder, so each is listed as its
      own root.
    from_schema: https://w3id.org/pd-biomarker-model
    reachable_from:
      source_ontology: obo:mondo
      source_nodes:
      - MONDO:0021095
      - MONDO:0007803
      - MONDO:0019037
      - MONDO:0007488
      relationship_types:
      - rdfs:subClassOf
      include_self: true
  ParkinsonsInstrumentEnum:
    name: ParkinsonsInstrumentEnum
    definition_uri: https://w3id.org/pd-biomarker-model/ParkinsonsInstrumentEnum
    description: 'Rating scale totals recorded in Parkinson''s studies. LOINC covers
      the MoCA total but not MDS-UPDRS: its UPDRS codes describe the original 1987
      scale, which has different items and ranges.'
    from_schema: https://w3id.org/pd-biomarker-model
    permissible_values:
      MDS_UPDRS_PART_I:
        text: MDS_UPDRS_PART_I
        description: MDS-UPDRS Part I (non-motor experiences of daily living) total,
          0-52.
        broad_mappings:
        - NCIT:C100769
      MDS_UPDRS_PART_II:
        text: MDS_UPDRS_PART_II
        description: MDS-UPDRS Part II (motor experiences of daily living) total,
          0-52.
        broad_mappings:
        - NCIT:C100769
      MDS_UPDRS_PART_III:
        text: MDS_UPDRS_PART_III
        description: MDS-UPDRS Part III (motor examination) total, 0-132.
        broad_mappings:
        - NCIT:C100769
      MDS_UPDRS_PART_IV:
        text: MDS_UPDRS_PART_IV
        description: MDS-UPDRS Part IV (motor complications) total, 0-24.
        broad_mappings:
        - NCIT:C100769
      HOEHN_YAHR:
        text: HOEHN_YAHR
        description: Hoehn and Yahr stage as rated in MDS-UPDRS, 0-5.
        meaning: NCIT:C100535
        title: MDS-UPDRS - Hoehn and Yahr Stage
        related_mappings:
        - LOINC:77714-4
      MOCA:
        text: MOCA
        description: Montreal Cognitive Assessment total score, 0-30.
        meaning: LOINC:72172-0
        title: Total score [MoCA]
        close_mappings:
        - NCIT:C162720
  DiagnosticCriteriaEnum:
    name: DiagnosticCriteriaEnum
    definition_uri: https://w3id.org/pd-biomarker-model/DiagnosticCriteriaEnum
    description: Published clinical diagnostic criteria for parkinsonian disorders.
    from_schema: https://w3id.org/pd-biomarker-model
    permissible_values:
      MDS_PD_2015:
        text: MDS_PD_2015
        description: MDS clinical diagnostic criteria for Parkinson's disease (Postuma
          et al., 2015).
        see_also:
        - doi:10.1002/mds.26424
      UK_PDS_BRAIN_BANK:
        text: UK_PDS_BRAIN_BANK
        description: UK Parkinson's Disease Society Brain Bank criteria (Hughes et
          al., 1992).
        see_also:
        - doi:10.1136/jnnp.55.3.181
      MDS_MSA_2022:
        text: MDS_MSA_2022
        description: MDS criteria for multiple system atrophy (Wenning et al., 2022).
        see_also:
        - doi:10.1002/mds.29005
      MDS_PSP_2017:
        text: MDS_PSP_2017
        description: "MDS criteria for progressive supranuclear palsy (H\xF6glinger\
          \ et al., 2017)."
        see_also:
        - doi:10.1002/mds.26987
      DLB_CONSORTIUM_2017:
        text: DLB_CONSORTIUM_2017
        description: Fourth consensus report of the DLB Consortium (McKeith et al.,
          2017).
        see_also:
        - doi:10.1212/WNL.0000000000004058
  DiagnosticCertaintyEnum:
    name: DiagnosticCertaintyEnum
    definition_uri: https://w3id.org/pd-biomarker-model/DiagnosticCertaintyEnum
    description: Level of diagnostic certainty defined by the criteria.
    from_schema: https://w3id.org/pd-biomarker-model
    permissible_values:
      CLINICALLY_ESTABLISHED:
        text: CLINICALLY_ESTABLISHED
        description: Clinically established (MDS PD and MSA criteria).
      PROBABLE:
        text: PROBABLE
        description: Probable.
      POSSIBLE:
        text: POSSIBLE
        description: Possible (PSP and DLB criteria).
  MedicationStateEnum:
    name: MedicationStateEnum
    definition_uri: https://w3id.org/pd-biomarker-model/MedicationStateEnum
    description: Dopaminergic medication state during a motor examination.
    from_schema: https://w3id.org/pd-biomarker-model
    permissible_values:
      'ON':
        text: 'ON'
        description: Examined while responding to dopaminergic medication.
      'OFF':
        text: 'OFF'
        description: Examined after withholding dopaminergic medication.
      UNTREATED:
        text: UNTREATED
        description: Not yet taking dopaminergic medication.
  CohortEnum:
    name: CohortEnum
    definition_uri: https://w3id.org/pd-biomarker-model/CohortEnum
    description: Study arm a participant was enrolled in.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      CASE:
        text: CASE
        description: Enrolled because they have the condition under study.
        meaning: NCIT:C216103
        title: Participant Case
      HEALTHY_CONTROL:
        text: HEALTHY_CONTROL
        description: Enrolled as a healthy comparison participant.
        meaning: NCIT:C94342
        title: Healthy Control
      PRODROMAL:
        text: PRODROMAL
        description: Enrolled with prodromal features but no diagnosis.
        meaning: NCIT:C209884
        title: Prodromal Phase of Disease
  SexEnum:
    name: SexEnum
    definition_uri: https://w3id.org/pd-biomarker-model/SexEnum
    description: Biological sex.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      FEMALE:
        text: FEMALE
        description: Female.
        meaning: PATO:0000383
        title: female
      MALE:
        text: MALE
        description: Male.
        meaning: PATO:0000384
        title: male
  DiseaseEnum:
    name: DiseaseEnum
    definition_uri: https://w3id.org/pd-biomarker-model/DiseaseEnum
    description: Any disease in MONDO.
    from_schema: https://w3id.org/pd-biomarker-model/core
    reachable_from:
      source_ontology: obo:mondo
      source_nodes:
      - MONDO:0000001
      relationship_types:
      - rdfs:subClassOf
      include_self: false
  PhenotypeEnum:
    name: PhenotypeEnum
    definition_uri: https://w3id.org/pd-biomarker-model/PhenotypeEnum
    description: Any phenotypic abnormality in HPO.
    from_schema: https://w3id.org/pd-biomarker-model/core
    reachable_from:
      source_ontology: obo:hp
      source_nodes:
      - HP:0000118
      relationship_types:
      - rdfs:subClassOf
      include_self: false
  SpecimenTypeEnum:
    name: SpecimenTypeEnum
    definition_uri: https://w3id.org/pd-biomarker-model/SpecimenTypeEnum
    description: Anatomical material a specimen consists of.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      CSF:
        text: CSF
        description: Cerebrospinal fluid.
        meaning: UBERON:0001359
        title: cerebrospinal fluid
      PLASMA:
        text: PLASMA
        description: Blood plasma.
        meaning: UBERON:0001969
        title: blood plasma
      SERUM:
        text: SERUM
        description: Blood serum.
        meaning: UBERON:0001977
        title: blood serum
      WHOLE_BLOOD:
        text: WHOLE_BLOOD
        description: Whole blood.
        meaning: UBERON:0000178
        title: blood
      SKIN:
        text: SKIN
        description: Skin biopsy.
        meaning: UBERON:0002097
        title: skin of body
  BrainRegionEnum:
    name: BrainRegionEnum
    definition_uri: https://w3id.org/pd-biomarker-model/BrainRegionEnum
    description: Any part of the brain in UBERON.
    from_schema: https://w3id.org/pd-biomarker-model/core
    reachable_from:
      source_ontology: obo:uberon
      source_nodes:
      - UBERON:0000955
      relationship_types:
      - rdfs:subClassOf
      - BFO:0000050
      include_self: true
  LateralityEnum:
    name: LateralityEnum
    definition_uri: https://w3id.org/pd-biomarker-model/LateralityEnum
    description: Side of the body.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      LEFT:
        text: LEFT
        description: Left side.
        meaning: PATO:0000366
        title: left
      RIGHT:
        text: RIGHT
        description: Right side.
        meaning: PATO:0000367
        title: right
      BILATERAL:
        text: BILATERAL
        description: Both sides, reported as the mean of left and right.
        meaning: PATO:0000618
        title: bilateral
  ModalityEnum:
    name: ModalityEnum
    definition_uri: https://w3id.org/pd-biomarker-model/ModalityEnum
    description: Source of a biomarker value.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      SPECIMEN:
        text: SPECIMEN
        description: Measured in a fluid or tissue specimen.
      IMAGING:
        text: IMAGING
        description: Measured from an imaging scan.
        meaning: OBI:0000185
        title: imaging assay
  MeasurementTypeEnum:
    name: MeasurementTypeEnum
    definition_uri: https://w3id.org/pd-biomarker-model/MeasurementTypeEnum
    description: Kind of quantity a biomarker value represents.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      CONCENTRATION:
        text: CONCENTRATION
        description: Absolute amount per volume, e.g. pg/mL.
        meaning: PATO:0000033
        title: concentration of
      RELATIVE_ABUNDANCE:
        text: RELATIVE_ABUNDANCE
        description: Platform-relative signal that is not an absolute concentration,
          e.g. SomaScan RFU or Olink NPX.
      RATIO:
        text: RATIO
        description: Dimensionless ratio, e.g. a DaT-SPECT specific binding ratio.
        meaning: STATO:0000184
        title: ratio
      CATEGORICAL:
        text: CATEGORICAL
        description: Qualitative result, e.g. a seed amplification assay call.
  UnitEnum:
    name: UnitEnum
    definition_uri: https://w3id.org/pd-biomarker-model/UnitEnum
    description: Units as case-sensitive UCUM codes. Curly-brace codes are UCUM annotations
      for arbitrary, platform-specific units.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      pg/mL:
        text: pg/mL
        description: Picograms per millilitre.
        meaning: UO:0010070
        title: picogram per milliliter
      ng/mL:
        text: ng/mL
        description: Nanograms per millilitre.
        meaning: UO:0000275
        title: nanogram per milliliter
      '1':
        text: '1'
        description: Dimensionless (UCUM unity), used for ratios.
        meaning: UO:0000186
        title: dimensionless unit
      '{RFU}':
        text: '{RFU}'
        description: SomaScan relative fluorescence units.
        meaning: NCIT:C77535
        title: Relative Fluorescence Intensity Unit
      '{NPX}':
        text: '{NPX}'
        description: Olink normalised protein expression, an arbitrary log2 unit.
  CategoricalResultEnum:
    name: CategoricalResultEnum
    definition_uri: https://w3id.org/pd-biomarker-model/CategoricalResultEnum
    description: Result of a qualitative assay.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      POSITIVE:
        text: POSITIVE
        description: The target was detected.
        meaning: NCIT:C38758
        title: Positive Finding
      NEGATIVE:
        text: NEGATIVE
        description: The target was not detected.
        meaning: NCIT:C38757
        title: Negative Finding
      INDETERMINATE:
        text: INDETERMINATE
        description: The result could not be called positive or negative.
        meaning: NCIT:C48658
        title: Indeterminate
  AssayTechnologyEnum:
    name: AssayTechnologyEnum
    definition_uri: https://w3id.org/pd-biomarker-model/AssayTechnologyEnum
    description: Assay technology.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      ELISA:
        text: ELISA
        description: Enzyme-linked immunosorbent assay.
        meaning: OBI:0000661
        title: enzyme-linked immunosorbent assay
      SIMOA:
        text: SIMOA
        description: Single-molecule array digital immunoassay.
        meaning: NCIT:C161406
        title: Single-Molecule Array
      SOMASCAN:
        text: SOMASCAN
        description: SomaScan aptamer-based proteomic assay.
        meaning: OBI:0003111
        title: SOMAscan assay
      OLINK:
        text: OLINK
        description: Olink proximity extension assay.
        meaning: OBI:0003112
        title: Olink assay
        broad_mappings:
        - OBI:0003113
      SEED_AMPLIFICATION_ASSAY:
        text: SEED_AMPLIFICATION_ASSAY
        description: Alpha-synuclein seed amplification assay (e.g. RT-QuIC). No ontology
          has a specific term, so only a broad mapping is given.
        broad_mappings:
        - OBI:0000070
      SPECT:
        text: SPECT
        description: Single-photon emission computed tomography.
        meaning: NCIT:C17203
        title: Single Photon Emission Computed Tomography
        broad_mappings:
        - OBI:0000185
  PlatformEnum:
    name: PlatformEnum
    definition_uri: https://w3id.org/pd-biomarker-model/PlatformEnum
    description: Commercial platform and panel version.
    from_schema: https://w3id.org/pd-biomarker-model/core
    permissible_values:
      SOMASCAN_5K:
        text: SOMASCAN_5K
        description: SomaScan 5K panel (assay v4.0).
        meaning: PRIDE:0000933
        title: SomaScan 5K
      SOMASCAN_7K:
        text: SOMASCAN_7K
        description: SomaScan 7K panel (assay v4.1).
        meaning: PRIDE:0000934
        title: SomaScan 7K
      OLINK_EXPLORE_3072:
        text: OLINK_EXPLORE_3072
        description: Olink Explore 3072 panel.
        meaning: PRIDE:0000657
        title: Olink Explore 3072/384
      OLINK_EXPLORE_HT:
        text: OLINK_EXPLORE_HT
        description: Olink Explore HT panel.
        meaning: PRIDE:0000673
        title: Olink Explore HT
      SIMOA_HD_X:
        text: SIMOA_HD_X
        description: Quanterix Simoa HD-X analyser. No ontology term exists.
      DAT_SPECT_IOFLUPANE:
        text: DAT_SPECT_IOFLUPANE
        description: Dopamine transporter SPECT with the tracer ioflupane (123I).
        related_mappings:
        - CHEBI:68855
  CuratorTypeEnum:
    name: CuratorTypeEnum
    definition_uri: https://w3id.org/pd-biomarker-model/CuratorTypeEnum
    description: Kind of agent that curated a record.
    from_schema: https://w3id.org/pd-biomarker-model/core
